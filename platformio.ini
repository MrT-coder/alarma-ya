[platformio]
default_envs = esp32dev

; ---------------------------------------------------------------------------
; Production firmware: MQTT receiver that drives the siren relay.
; ---------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<main.cpp>
lib_deps =
    knolleary/PubSubClient@^2.8

; ---------------------------------------------------------------------------
; Bench test: toggles GPIO26 so the relay's active level can be identified.
; No WiFi, no MQTT - isolates the electrical question from everything else.
;   pio run -e relay_polarity -t upload -t monitor
; ---------------------------------------------------------------------------
[env:relay_polarity]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<relay_polarity.cpp>
